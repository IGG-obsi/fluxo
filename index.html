<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Fluxo</title>
<style>
:root{
  --bg:#16181c;--bg2:#1d2025;--bg3:#24282e;--line:#2a2e35;--txt:#f1f2f4;--mut:#8a909a;--dim:#4d525a;
  --acc:#ff5a1f;--pos:#2f6b3a;--mid:#9a7400;--neg:#a5484d;
  --c-entrada:#3fa34d;--c-saida:#e5541e;--c-diario:#e0287a;--c-economia:#8bd41f;--c-cartao:#7c4dff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--txt);background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
#app{max-width:620px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);flex-shrink:0}
.cal{width:46px;height:46px;border-radius:8px;background:var(--bg3);font-weight:700;font-size:19px;position:relative;overflow:hidden;padding-top:9px}
.cal::before{content:'';position:absolute;top:0;left:0;right:0;height:9px;background:var(--acc)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{width:40px;height:40px;font-size:26px;color:var(--mut)}
.monthnav span{font-size:26px;font-weight:700;min-width:112px;text-align:center}
.grid-ico{width:46px;height:46px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:4px;border-radius:8px}
.grid-ico i{border-radius:2px;background:#9a7400}
main{flex:1;min-height:0;position:relative}
.view{display:none;height:100%;overflow:auto}
.view.active{display:flex;flex-direction:column}
#view-saldos{overflow:hidden}
.colhead{display:grid;grid-template-columns:58px 1fr 1fr;align-items:center;height:58px;border-bottom:1px solid var(--line);color:var(--mut);font-size:17px;flex-shrink:0}
.colhead>span:first-child{text-align:center}
.colhead>span:last-child{text-align:right;padding-right:16px}
.pill{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:30px;padding:7px 14px;font-weight:700;font-size:17px;color:var(--txt);justify-self:start;margin-left:6px;white-space:nowrap}
.pill .chev{color:var(--mut);font-size:14px}
.rows{flex:1;overflow:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.row{display:grid;grid-template-columns:58px 1fr 1fr;height:54px;border-bottom:1px solid var(--line)}
.dcell{display:flex;align-items:center;justify-content:center;font-size:20px;border-right:1px solid var(--line);position:relative;background:var(--bg)}
.row.future .dcell{background:#20252c}
.row.today .dcell{background:#fff;color:#111;font-weight:700}
.dcell.chk::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 18px 18px 0;border-color:transparent #5cc06a transparent transparent}
.vcell{display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:18px;gap:8px;cursor:pointer;overflow:hidden}
.vcell .val{white-space:nowrap}
.vcell.zero{color:var(--dim)}
.vcell.zero .ic{background:#3a3e45!important;color:#16181c}
.vcell.proj .val{color:#d6d8dc}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%}
.ic{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
.ic svg{width:15px;height:15px}
.ic.lg{width:30px;height:30px;font-size:15px}
.ic.lg svg{width:18px;height:18px}
.scell{display:flex;align-items:center;justify-content:flex-end;padding:0 14px;font-size:18px;cursor:pointer;white-space:nowrap}
.pos{background:var(--pos)}.mid{background:var(--mid)}.neg{background:var(--neg)}
nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;background:var(--bg)}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:14px;font-weight:600;color:var(--txt);border-top:3px solid transparent}
nav.bottom button.on{color:var(--acc);border-top-color:var(--acc)}
nav.bottom svg{width:26px;height:26px}
nav.bottom .plus{align-self:center;justify-self:center;width:62px;height:62px;border-radius:50%;background:#fff;color:#111;font-size:36px;font-weight:300;line-height:1;display:flex;align-items:center;justify-content:center;border:0;padding:0}
.pad{padding:16px}
h2{font-size:22px;margin-bottom:12px}
h3{font-size:20px;margin-bottom:14px}
.mut{color:var(--mut)}.small{font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.card .k{font-size:13px;color:var(--mut);margin-bottom:6px}
.card .v{font-size:20px;font-weight:700}
.card .s{font-size:12px;color:var(--mut);margin-top:6px}
.bar{height:8px;border-radius:5px;background:var(--bg3);margin-top:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--c-economia)}
.gpos{color:#5cc06a}.gneg{color:#f07a7f}
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li .grow{flex:1;min-width:0}
.li .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sub{font-size:12px;color:var(--mut);margin-top:2px}
.li .amt{font-weight:700;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-right:4px;color:#fff}
.menu .li{padding:18px 6px;font-size:18px}
.menu .li .arr{color:var(--dim)}
.sheet-wrap,.dlg-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.dlg-wrap{z-index:40;align-items:center;padding:20px}
.sheet-wrap.on,.dlg-wrap.on{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:620px;max-height:90dvh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.dlg{background:var(--bg2);width:100%;max-width:400px;border-radius:18px;padding:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.shead h3{margin:0}
.x{font-size:28px;color:var(--mut);width:40px;height:40px}
label.f{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}
label.f>input,label.f>select{margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.seg button{border:2px solid var(--line);border-radius:12px;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut)}
.seg button.on{border-color:var(--acc);color:var(--txt)}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:700;background:var(--bg3);border:1px solid var(--line)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:#f07a7f}
.btn.full{width:100%;flex:none;display:block;margin-top:10px}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 12px;line-height:1.45}
.opt{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);width:100%;font-size:18px;font-weight:600}
.opt.on{color:var(--acc)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
.overlay.on{display:flex}
.hz{flex:1;overflow:auto}
.hz table{border-collapse:collapse;font-size:12px}
.hz th,.hz td{border:1px solid var(--bg);padding:0;height:30px;min-width:60px;text-align:right}
.hz td span{display:block;padding:0 6px;line-height:30px}
.hz th{position:sticky;top:0;background:var(--bg2);z-index:2;padding:8px 6px;font-size:13px;cursor:pointer}
.hz td.d,.hz th.d{position:sticky;left:0;background:var(--bg2);z-index:1;min-width:36px;text-align:center;color:var(--mut)}
.hz th.d{z-index:3}
.hz td.t span{outline:2px solid #fff;outline-offset:-2px}
.hz tfoot td{background:var(--bg2);font-weight:700}
.hz tfoot td span{padding:0 6px}
details.tag{border-bottom:1px solid var(--line)}
details.tag summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 4px;cursor:pointer}
details.tag summary::-webkit-details-marker{display:none}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.colors{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:#fff}
.inline{display:flex;gap:8px;margin-top:12px}
.inline input{flex:1}
.inline .btn{flex:0 0 auto;padding:12px 16px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:20px;font-weight:600;font-size:14px;z-index:50;display:none;max-width:90vw;text-align:center}
.guide p{margin-bottom:12px;line-height:1.55;color:#d6d8dc}
.guide b{color:#fff}
.status{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--bg3);margin:10px 0}

.side,.brand,.plt{display:none}
#view-totais{padding-bottom:24px}
.row.wide,.colhead.wide{grid-template-columns:64px repeat(5,minmax(0,1fr)) minmax(0,1.3fr)}
.row.wide{height:46px}
.row.wide .vcell{justify-content:flex-end;font-size:15px;border-right:1px solid var(--line);padding:0 10px}
.row.wide .scell{font-size:16px}
.colhead.wide .ch{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding-right:10px;font-size:13px;color:var(--mut)}
.colhead.wide .ch .ic{width:20px;height:20px;font-size:11px}
.sec{padding:26px 18px 14px;color:var(--mut);font-size:17px;font-weight:600;border-bottom:1px solid var(--line)}
.calc{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px;border-bottom:1px solid var(--line);text-align:left;gap:10px}
.calc .ct{font-size:19px;font-weight:700;margin-bottom:8px}
.fx{display:flex;align-items:center;gap:3px}
.fx .ic{width:22px;height:22px;font-size:12px}
.op{color:var(--mut);font-size:14px;margin:0 1px}
.cv{text-align:right;font-size:19px;white-space:nowrap}
.cs{font-size:14px;color:var(--mut);margin-top:6px;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.cs .ic{width:20px;height:20px;font-size:11px}
.pbar{width:90px;height:16px;border:2px solid #3fa34d;border-radius:10px;overflow:hidden;display:inline-block;margin:0 4px}
.pbar i{display:block;height:100%;background:#3fa34d}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:17px 18px;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
.mrow .grow{flex:1;font-weight:600}
.ic.pj{background:transparent!important;border:2px dashed var(--c-diario);color:var(--c-diario)}
.tghead{display:flex;align-items:center;gap:6px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);color:var(--mut);font-size:17px;font-weight:600}
.tghead span{flex:1}
.tghead button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--txt)}
.tghead svg,.ecirc svg{width:26px;height:26px}
.tgsearch{display:flex;align-items:center;gap:10px;padding:4px 18px;border-bottom:1px solid var(--line);color:var(--mut)}
.tgsearch svg{width:22px;height:22px;flex-shrink:0}
.tgsearch input{border:0;background:transparent;padding:14px 0}
.empty{display:flex;flex-direction:column;align-items:center;gap:22px;padding:80px 30px;text-align:center;color:var(--mut);line-height:1.5}
.ecirc{width:100px;height:100px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
details.tag{padding:0 18px}
.lnk{color:var(--acc);font-weight:700;text-decoration:underline;font-size:12px}
.ptot{background:var(--bg3);border-radius:14px;padding:14px 16px;margin-top:16px}
.ptot .pr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-weight:600}
.ptot select{width:auto;padding:8px 10px}
.ptot .big{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.ptot .big b{font-size:28px}
.cnt{text-align:right;font-size:12px;color:var(--mut);margin:-6px 0 10px}
.ct2{font-weight:700;margin-bottom:4px}
.tcolors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 18px}
.tcolors button{padding:15px 16px;border-radius:10px;text-align:left;font-weight:700;display:flex;justify-content:space-between;border:2px solid transparent;color:#fff}
.tcolors button .ok{visibility:hidden}.tcolors button.on{border-color:#ddd}.tcolors button.on .ok{visibility:visible}
.adv{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:14px}
.adv summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.adv summary::-webkit-details-marker{display:none}
.chk{display:flex;gap:10px;align-items:center;padding:10px 0;font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;padding:0;accent-color:var(--acc);flex-shrink:0}
#pages{position:fixed;inset:0;z-index:25;display:none}
.frow.nopad{padding:0;cursor:default}
.fmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0 14px 0 22px;min-height:76px;text-align:left;font-size:21px;align-self:stretch}
.fmain .chev{margin-left:auto}
.fside{width:58px;align-self:stretch;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--txt);flex-shrink:0}
.fside svg{width:26px;height:26px}
.fside.dis{color:#4a4f57;cursor:default}
.hashic{font-size:30px;font-weight:700;color:var(--txt)}
#cntV{font-weight:400;overflow:visible}#cntV b{font-weight:700}
.dphd{display:flex;align-items:center;gap:4px;padding:16px 4px 10px}
.dphd b{flex:1;font-size:22px}
.dphd button{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.dphd svg{width:28px;height:28px}
.dpgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:6px;margin-bottom:20px}
.dpgrid .wd{color:#d6d8dc;font-size:16px;padding:8px 0}
.dpgrid button{height:50px;width:50px;justify-self:center;border-radius:50%;font-size:20px}
.dpgrid button.out{color:#555a62}
.dpgrid button.td:not(.sel){box-shadow:inset 0 0 0 2px #3a3e45}
.dpgrid button.sel{background:#fff;color:#111;font-weight:700}
.popt{display:flex;align-items:center;gap:16px;width:100%;padding:20px 4px;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;text-align:left}
.popt .grow{flex:1;min-width:0}
.popt .sub{font-size:14px;color:var(--mut);font-weight:400;margin-top:3px}
.popt .rd{width:24px;height:24px;border-radius:50%;border:2px solid #5a5e66;flex-shrink:0}
.popt.on .rd{border:7px solid var(--acc)}
.sheet .pbtn{margin-top:18px}
.pr.click{cursor:pointer}
.pr.click span{display:flex;align-items:center;gap:6px}
.pr.click svg{width:20px;height:20px;color:var(--mut)}
.yearsel{display:flex;align-items:center;justify-content:space-between;margin:16px 18px;border:2px solid var(--line);border-radius:40px;padding:4px 8px}
.yearsel b{font-size:20px}
.yearsel button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.yearsel svg{width:24px;height:24px}
.howto{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.howto summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:22px 18px;color:var(--mut);font-weight:700;font-size:18px;cursor:pointer}
.howto summary::-webkit-details-marker{display:none}
.howto summary svg{width:22px;height:22px;transition:transform .15s}
.howto[open] summary svg{transform:rotate(180deg)}
.howto p{padding:0 18px 24px;font-size:19px;line-height:1.5;margin-top:-6px}
.ylbl{color:var(--mut);font-weight:700;font-size:18px;padding:24px 18px 16px;border-bottom:1px solid var(--line)}
.ybig{padding:24px 18px 10px}
.ybig .k{color:var(--mut);font-weight:700;font-size:18px}
.ybig .v{font-size:46px;font-weight:800;margin-top:4px}
.ymrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 18px;border-bottom:1px solid var(--line);font-size:21px;width:100%;text-align:left}
.ymrow>b{font-weight:700}
.ymrow .r{text-align:right}
.ymrow .r .s{color:var(--mut);margin-top:10px}
.yblock{display:block;width:100%;text-align:left;padding:24px 18px;border-bottom:1px solid var(--line);font-size:21px}
.yblock .hd{display:flex;justify-content:space-between;font-weight:700}
.ecobar{display:flex;align-items:center;gap:8px;margin:14px 0}
.ecobar .pbar{flex:1;width:auto;margin:0}
.ecolbl{display:flex;justify-content:space-between;font-size:20px;line-height:1.5}
.ecolbl .k{color:var(--mut);font-weight:700}
.ecolbl div:last-child{text-align:right}
.tsearch{display:flex;align-items:center;gap:14px;padding:6px 18px;border-bottom:1px solid var(--line);color:var(--mut)}
.tsearch svg{width:26px;height:26px;flex-shrink:0}
.tsearch input{border:0;background:transparent;padding:18px 0;font-size:20px;border-radius:0}
.tprow{display:flex;align-items:center;gap:16px;width:100%;padding:24px 18px;border-bottom:1px solid var(--line);font-size:21px;font-weight:700;text-align:left;cursor:pointer}
.tprow .tg{width:36px;height:22px;flex-shrink:0;clip-path:polygon(0 0,75% 0,100% 50%,75% 100%,0 100%);border-radius:3px}
.tprow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tprow .cb{width:28px;height:28px;border:2px solid #5a5e66;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tprow.on .cb{background:var(--acc);border-color:var(--acc)}
.tprow .cb svg{width:20px;height:20px;color:#fff;visibility:hidden}
.tprow.on .cb svg{visibility:visible}
.phead.amt .rs{font-size:42px;font-weight:800}
.frow{position:relative;display:flex;align-items:center;gap:16px;padding:0 22px;min-height:76px;border-bottom:1px solid var(--line);font-size:21px;cursor:pointer}
.frow .ficon{width:30px;display:flex;justify-content:center;color:var(--txt);flex-shrink:0}
.frow .ficon svg{width:28px;height:28px}
.frow .ficon .ic{width:32px;height:32px;font-size:16px}
.frow .ficon .ic svg{width:19px;height:19px}
.frow .fl{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fv{font-size:21px;white-space:nowrap}
.frow .chev{color:var(--mut);display:flex}
.frow .chev svg{width:22px;height:22px}
.frow input.fin{flex:1;min-width:0;border:0;background:transparent;font-size:21px;padding:22px 0;border-radius:0}
.frow input.fin::placeholder{color:var(--mut)}
.frow .ovl{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:0;font-size:16px}
.frow .cnt-in{flex:0 0 110px;text-align:right;border:0;background:transparent;font-size:21px;padding:18px 0;border-radius:0}
.fbtns{padding:26px 22px 10px}
.tbtn{width:100%;padding:20px;border-radius:40px;font-weight:700;font-size:19px}

<body>
<div id="app">
  <header class="top">
    <button id="btnToday" class="cal" title="voltar para hoje"><span id="calDay">1</span></button>
    <div class="monthnav"><button id="prevM" aria-label="mês anterior">‹</button><span id="monthLbl"></span><button id="nextM" aria-label="próximo mês">›</button></div>
    <button id="btnHorizon" class="grid-ico" title="horizonte de saldos"></button>
  </header>
  <main>
    <section id="view-saldos" class="view active">
      <div class="colhead" id="colhead"></div>
      <div id="rows" class="rows"></div>
    </section>
    <section id="view-totais" class="view"></section>

  </main>

    <button data-tab="saldos" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M3 14h18M9 4v16"/></svg>saldos</button>
    <button data-tab="totais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h7M7.5 3.5v7M14 4l6 6M20 4l-6 6M4 17h7M14 15h6M14 19h6"/></svg>totais</button>
    <button class="plus" id="btnPlus" aria-label="adicionar"><span>+</span><span class="plt">nova movimentação</span></button>
    <button data-tab="tags"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 6h10l3 4-3 4H7z"/><path d="M4 9v9h11"/></svg>tags</button>
    <button data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M5 10h14M5 14h14M5 18h14"/></svg>menu</button>
  </nav>
</div>
<div id="sheetWrap" class="sheet-wrap"><div class="sheet" id="sheet"></div></div>
<div id="dlgWrap" class="dlg-wrap"><div class="dlg" id="dlg"></div></div>

<div id="toast"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const DB_KEY='fluxo-db-v1',UI_KEY='fluxo-ui',SYNC_KEY='fluxo-sync',DIRTY_KEY='fluxo-dirty';
const TAG_COLORS=[['cinza','#5a5d63'],['azul','#3d5f8f'],['amarelo','#6e5a1c'],['verde','#3d7b67'],['vermelho','#9a3b3b'],['roxo','#5c4a86'],['rosa','#8a4a62'],['marrom','#6b5034']];

/* ---------- storage ---------- */
const mem={};
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return k in mem?mem[k]:null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
};
const now=()=>Date.now();
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=v=>{const x=Math.round(v*100)/100;return x===0?0:x};
const money=v=>'R$ '+r2(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const compact=v=>{const a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(1).replace('.',',')+'M';if(a>=1000)return (v/1000).toFixed(1).replace('.',',')+'k';return String(Math.round(v)||0)};
function parseMoney(str){let s=String(str??'').trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:NaN}
const numStr=v=>v===''||v==null?'':String(r2(v)).replace('.',',');

/* ---------- dates (strings YYYY-MM-DD) ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return {y,m,d}};
const toDate=s=>{const p=parseD(s);return new Date(p.y,p.m-1,p.d)};
const fromDate=dt=>ds(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
const todayStr=()=>fromDate(new Date());
const addDays=(s,n)=>{const dt=toDate(s);dt.setDate(dt.getDate()+n);return fromDate(dt)};
const daysBetween=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const dim=(y,m)=>new Date(y,m,0).getDate();
const addMonths=(y,m,n)=>{const t=y*12+(m-1)+n;return {y:Math.floor(t/12),m:t%12+1}};
const niceDate=s=>{const p=parseD(s);return `${SEM[toDate(s).getDay()]}, ${p.d} ${MESES[p.m-1]}`};

/* ---------- types ---------- */
const TYPES={
  entrada:{label:'entradas',one:'entrada',color:'#3fa34d'},
  saida:{label:'saídas',one:'saída',color:'#e5541e'},
  diario:{label:'diários',one:'diário',color:'#e0287a'},
  economia:{label:'economias',one:'economia',color:'#8bd41f'},
  cartao:{label:'gastos com cartão',one:'cartão',color:'#7c4dff'}
};
const TYPE_KEYS=Object.keys(TYPES);
const FILTERS=[...TYPE_KEYS,'todas'];
const ICO={
  entrada:'<svg viewBox="0 0 24 24"><path d="M17 7L7 17M7 9v8h8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  saida:'<svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  diario:'D',economia:'E',cartao:'C'
};
const ic=(t,cls='')=>t==='todas'
  ?`<span class="ic ${cls}" style="background:#3a3e45"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.4" fill="#ccc"/><circle cx="12" cy="6" r="2.4" fill="#ccc"/><circle cx="18" cy="12" r="2.4" fill="#ccc"/><circle cx="12" cy="18" r="2.4" fill="#ccc"/></svg></span>`
  :`<span class="ic ${cls}" style="background:${TYPES[t].color}">${ICO[t]}</span>`;
const fLabel=f=>f==='todas'?'todas':TYPES[f].label;

/* ---------- database ---------- */
function emptyDB(){return {v:1,series:{},tags:{},cards:{},prev:{},checks:{},settings:{greenFrom:1000,divisor:30,u:0}}}
function load(){try{const r=JSON.parse(store.get(DB_KEY));if(r&&r.series)return Object.assign(emptyDB(),r)}catch(e){}return emptyDB()}
let db=load();
let ui=(()=>{try{return Object.assign({filter:'diario'},JSON.parse(store.get(UI_KEY))||{})}catch(e){return {filter:'diario'}}})();
const saveUI=()=>store.set(UI_KEY,JSON.stringify(ui));
let cache=null;
function save(){store.set(DB_KEY,JSON.stringify(db));store.set(DIRTY_KEY,'1');cache=null;scheduleSync()}
const live=o=>Object.values(o).filter(x=>!x.del);
const tagsOf=it=>(Array.isArray(it.tag)?it.tag:(it.tag?[it.tag]:[])).filter(id=>db.tags[id]&&!db.tags[id].del);

/* ---------- recurrence ---------- */
function nth(s,i){
  if(s.rep==='day')return addDays(s.start,i);
  if(s.rep==='week')return addDays(s.start,7*i);
  if(s.rep==='month'){const p=parseD(s.start);const a=addMonths(p.y,p.m,i);return ds(a.y,a.m,Math.min(p.d,dim(a.y,a.m)))}
  return s.start;
}
function occ(s,from,to){
  const out=[];if(s.del)return out;
  if(!s.rep||s.rep==='none'){if(s.start>=from&&s.start<=to)out.push([s.start,0]);return out}
  let i=0;
  if(s.start<from){
    if(s.rep==='day')i=daysBetween(s.start,from);
    else if(s.rep==='week')i=Math.floor(daysBetween(s.start,from)/7);
    else{const a=parseD(s.start),b=parseD(from);i=Math.max(0,(b.y-a.y)*12+(b.m-a.m)-1)}
  }
  for(let k=0;k<3000;k++,i++){
    if(s.count&&i>=s.count)break;
    const d=nth(s,i);
    if(d>to)break;
    if(s.until&&d>s.until)break;
    if(d>=from)out.push([d,i]);
  }
  return out;
}
const prevTotal=()=>live(db.prev).reduce((a,p)=>a+(+p.amount||0),0);
function divFor(dstr){const dv=db.settings.divisor;if(dv==='mes'){const p=parseD(dstr||todayStr());return dim(p.y,p.m)}return +dv||30}
const dailyProj=dstr=>prevTotal()/divFor(dstr);

/* ---------- engine ---------- */
let view=(()=>{const p=parseD(todayStr());return {y:p.y,m:p.m}})();
function compute(){
  const today=todayStr(),tp=parseD(today);
  const e1=addMonths(tp.y,tp.m,24),e2=addMonths(view.y,view.m,1);
  const e=(e2.y*12+e2.m)>(e1.y*12+e1.m)?e2:e1;
  const to=ds(e.y,e.m,dim(e.y,e.m));
  if(cache&&cache.today===today&&cache.to>=to)return cache;
  const series=live(db.series);
  let from=ds(tp.y,tp.m,1);
  for(const s of series)if(s.start<from)from=s.start;
  const fp=parseD(from);from=ds(fp.y,fp.m,1);
  const items={};
  for(const s of series){
    for(const [d,i] of occ(s,from,to)){
      const ex=s.exc&&s.exc[d];
      if(ex&&ex.del)continue;
      const pick=k=>ex&&ex[k]!==undefined?ex[k]:s[k];
      (items[d]||(items[d]=[])).push({sid:s.id,date:d,idx:i,type:s.type,amount:+pick('amount')||0,desc:pick('desc')||'',tag:pick('tag')||[],card:pick('card')||'',rec:!!(s.rep&&s.rep!=='none')});
    }
  }
  const pt=prevTotal();
  const tagFlag=(id,k)=>{const t=id&&db.tags[id];return !!(t&&!t.del&&t[k])};
  const z=()=>({entrada:0,saida:0,diario:0,economia:0,cartao:0});
  const days={};let bal=0,started=false;const proj=pt/divFor(today);
  for(let d=from;d<=to;d=addDays(d,1)){
    const list=items[d]||[];
    const sums=z(),bs=z(),ts=z();
    for(const it of list){const tg=tagsOf(it);sums[it.type]+=it.amount;if(!tg.some(id=>tagFlag(id,'noSaldo')))bs[it.type]+=it.amount;if(!tg.some(id=>tagFlag(id,'noTot')))ts[it.type]+=it.amount}
    const projD=d>today&&pt>0?pt/divFor(d):0;
    sums.diario+=projD;bs.diario+=projD;ts.diario+=projD;
    if(list.length||projD)started=true;
    bal+=bs.entrada-bs.saida-bs.diario-bs.economia-bs.cartao;
    days[d]={sums,ts,list,projD,bal:started?bal:0};
  }
  cache={today,from,to,days,items,proj};
  return cache;
}
const emptyDay={sums:{entrada:0,saida:0,diario:0,economia:0,cartao:0},ts:{entrada:0,saida:0,diario:0,economia:0,cartao:0},list:[],projD:0,bal:0};
const dayOf=k=>compute().days[k]||emptyDay;
const balCls=v=>v<-0.004?'neg':(v>=(+db.settings.greenFrom||0)?'pos':'mid');

function monthTotals(y,m){
  const c=compute(),today=c.today,n=dim(y,m);
  const t={entrada:0,saida:0,diario:0,economia:0,cartao:0,dReal:0,dPast:0,dProj:0,projDays:0,elapsed:0,byCard:{}};
  for(let d=1;d<=n;d++){
    const k=ds(y,m,d),day=c.days[k];
    if(k<=today)t.elapsed++;
    if(!day)continue;
    for(const tk of TYPE_KEYS)t[tk]+=day.ts[tk];
    t.dProj+=day.projD;if(day.projD>0)t.projDays++;
    const real=day.ts.diario-day.projD;t.dReal+=real;if(k<=today)t.dPast+=real;
    for(const it of day.list)if(it.type==='cartao'){t.byCard[it.card]=(t.byCard[it.card]||0)+it.amount}
  }
  t.perf=t.entrada-t.saida-t.diario-t.economia-t.cartao;
  t.custo=t.saida+t.diario+t.cartao;
  t.pct=t.entrada>0?t.economia/t.entrada:0;
  t.end=(c.days[ds(y,m,n)]||emptyDay).bal;
  t.avg=t.elapsed?t.dPast/t.elapsed:0;
  t.meta=dailyProj(ds(y,m,1));
  return t;
}

/* ---------- toast / sheet / dialog ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2400)}
function openSheet(html,mount){$('#sheetWrap').style.zIndex=(typeof pageStack!=='undefined'&&pageStack.length)?'35':'';const s=$('#sheet');s.innerHTML=html;$('#sheetWrap').classList.add('on');s.scrollTop=0;s.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);if(mount)mount(s)}
function closeSheet(){$('#sheetWrap').classList.remove('on')}
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});
const shead=t=>`<div class="shead"><h3>${t}</h3><button class="x" data-close>×</button></div>`;
function dialog(title,text,buttons){
  return new Promise(res=>{
    const d=$('#dlg');
    d.innerHTML=`<h3>${title}</h3>${text?`<p class="mut" style="margin-bottom:16px;line-height:1.5">${text}</p>`:''}${buttons.map((b,i)=>`<button class="btn full ${b.cls||''}" data-i="${i}">${b.label}</button>`).join('')}<button class="btn full" data-i="-1">cancelar</button>`;
    $('#dlgWrap').classList.add('on');
    d.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{$('#dlgWrap').classList.remove('on');const i=+b.dataset.i;res(i<0?null:buttons[i].val)});
  });
}
function promptDialog(title,label,value,mode){
  return new Promise(res=>{
    const d=$('#dlg');
    d.innerHTML=`<h3>${title}</h3><label class="f">${label}<input id="pIn" inputmode="${mode||'text'}" value="${esc(value||'')}"></label><div class="actions"><button class="btn" id="pNo">cancelar</button><button class="btn primary" id="pOk">ok</button></div>`;
    $('#dlgWrap').classList.add('on');
    const inp=$('#pIn');if(mode==='decimal')maskMoney(inp,true);setTimeout(()=>inp.focus(),50);
    const done=v=>{$('#dlgWrap').classList.remove('on');res(v)};
    $('#pNo').onclick=()=>done(null);$('#pOk').onclick=()=>done(inp.value);
    inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value)};
  });
}
const scopeChoice=verb=>dialog(`${verb} movimentação recorrente`,'essa movimentação se repete. aplicar em:',[{label:'só esta',val:'one'},{label:'esta e as próximas',val:'next'},{label:'todas',val:'all'}]);

function renderHeader(){
  $('#calDay').textContent=parseD(todayStr()).d;
  $('#monthLbl').textContent=`${MESES[view.m-1]}/${String(view.y).slice(2)}`;
  // grid icon: colors of next 9 months' end balance
  const tp=parseD(todayStr());let h='';
  for(let i=0;i<9;i++){const a=addMonths(tp.y,tp.m,i);const t=(compute().days[ds(a.y,a.m,dim(a.y,a.m))]||emptyDay).bal;h+=`<i style="background:var(--${balCls(t)})"></i>`}
  $('#btnHorizon').innerHTML=h;
}

/* ---------- render: saldos ---------- */
let wantScrollToday=true,scrollKey=null;
const isWide=()=>window.matchMedia('(min-width:1000px)').matches;
const isSide=()=>window.matchMedia('(min-width:1400px)').matches;
const SHORT={entrada:'entradas',saida:'saídas',diario:'diários',economia:'economias',cartao:'cartão'};
function renderRows(){
  const c=compute(),today=c.today,n=dim(view.y,view.m),f=ui.filter,wide=isWide();
  const ch=$('#colhead');ch.classList.toggle('wide',wide);
  if(wide)ch.innerHTML=`<span>dia</span>${TYPE_KEYS.map(t=>`<span class="ch">${ic(t)}${SHORT[t]}</span>`).join('')}<span class="ch" style="padding-right:14px">saldo</span>`;
  else{ch.innerHTML=`<span>dia</span><button id="filterBtn" class="pill">${ic(f)}<span>${fLabel(f)}</span><span class="chev">▾</span></button><span>saldos</span>`;$('#filterBtn').onclick=openFilter}
  let h='';
  for(let d=1;d<=n;d++){
    const k=ds(view.y,view.m,d),day=dayOf(k);
    const chk=db.checks[k]&&db.checks[k].v;
    const cls=k===today?'today':(k>today?'future':'past');
    const projOnly=day.projD>0&&!day.list.some(it=>it.type==='diario');
    let cell;
    if(wide){
      cell=TYPE_KEYS.map(t=>{const v=day.sums[t];return `<div class="vcell ${v>0?'':'zero'} ${t==='diario'&&projOnly?'proj':''}" data-t="${t}"><span class="val">${v>0?money(v):'–'}</span></div>`}).join('');
    }else if(f==='todas'){
      const net=day.sums.entrada-day.sums.saida-day.sums.diario-day.sums.economia-day.sums.cartao;
      const present=TYPE_KEYS.filter(t=>day.sums[t]>0);
      cell=`<div class="vcell ${present.length?'':'zero'}"><span class="dots">${present.map(t=>`<i style="background:${TYPES[t].color}"></i>`).join('')||ic('todas')}</span><span class="val">${money(net)}</span></div>`;
    }else{
      const v=day.sums[f];
      cell=`<div class="vcell ${v>0?'':'zero'} ${f==='diario'&&projOnly?'proj':''}">${ic(f)}<span class="val">${money(v)}</span></div>`;
    }
    h+=`<div class="row ${cls} ${wide?'wide':''}" data-d="${k}"><button class="dcell ${chk?'chk':''}">${d}</button>${cell}<div class="scell ${balCls(day.bal)}">${money(day.bal)}</div></div>`;
  }
  const rows=$('#rows');rows.innerHTML=h;
  if(scrollKey||wantScrollToday){const tr=scrollKey?rows.querySelector(`.row[data-d="${scrollKey}"]`):rows.querySelector('.row.today');wantScrollToday=false;scrollKey=null;rows.scrollTop=tr?Math.max(0,tr.offsetTop-rows.offsetTop-tr.offsetHeight*3):0}
}

/* row interactions: tap day = check-in, tap cell = day detail, long-press/right-click = add */
(function(){
  const rows=$('#rows');let lp={t:null,x:0,y:0,fired:false,touch:false};let sw=null;
  const typeOf=cell=>cell&&cell.dataset.t?cell.dataset.t:(ui.filter==='todas'?'diario':ui.filter);
  rows.addEventListener('pointerdown',e=>{
    lp.touch=e.pointerType!=='mouse';lp.fired=false;
    if(e.button!==0)return;
    const cell=e.target.closest('.vcell,.scell');if(!cell)return;
    lp.x=e.clientX;lp.y=e.clientY;clearTimeout(lp.t);
    lp.t=setTimeout(()=>{lp.t=null;lp.fired=true;if(navigator.vibrate)navigator.vibrate(15);openForm({date:cell.parentNode.dataset.d,type:typeOf(cell)})},480);
  });
  rows.addEventListener('pointermove',e=>{if(lp.t&&(Math.abs(e.clientX-lp.x)>10||Math.abs(e.clientY-lp.y)>10)){clearTimeout(lp.t);lp.t=null}});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>rows.addEventListener(ev,()=>{clearTimeout(lp.t);lp.t=null}));
  rows.addEventListener('click',e=>{
    if(lp.fired){lp.fired=false;return}
    const row=e.target.closest('.row');if(!row)return;
    if(e.target.closest('.dcell'))return toggleCheck(row.dataset.d);
    const vc=e.target.closest('.vcell');
    openDay(row.dataset.d,vc&&vc.dataset.t?vc.dataset.t:(isWide()?'todas':ui.filter));
  });
  rows.addEventListener('contextmenu',e=>{e.preventDefault();if(lp.touch)return;const row=e.target.closest('.row'),cell=e.target.closest('.vcell,.scell');if(row&&cell)openForm({date:row.dataset.d,type:typeOf(cell)})});
  rows.addEventListener('touchstart',e=>{const t=e.touches[0];sw={x:t.clientX,y:t.clientY}},{passive:true});
  rows.addEventListener('touchend',e=>{
    if(!sw||isWide())return;const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;sw=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<45){clearTimeout(lp.t);lp.t=null;const i=FILTERS.indexOf(ui.filter);ui.filter=FILTERS[(i+(dx<0?1:-1)+FILTERS.length)%FILTERS.length];saveUI();renderRows()}
  },{passive:true});
})();

function toggleCheck(k){const cur=db.checks[k]&&db.checks[k].v;db.checks[k]={v:!cur,u:now()};save();renderRows();if(!cur)toast(`check-in de ${niceDate(k)} ✓`)}

function openFilter(){
  const sub={...TSUB,todas:'tudo que entra e sai no dia'};
  const name=f=>f==='todas'?'todas':TYPES[f].label;
  openSheet(`<div class="shead"><h3 class="big">mostrar</h3><button class="x" data-close>${SVG_X}</button></div>`+
    FILTERS.map(f=>`<button class="topt ${f===ui.filter?'on':''}" data-f="${f}">${ic(f,'xl')}<div><div class="tt">${name(f)}</div><div class="ts">${sub[f]}</div></div>${f===ui.filter?`<span class="ck">${SVG_CHECK}</span>`:''}</button>`).join(''),s=>{
    s.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ui.filter=b.dataset.f;saveUI();closeSheet();renderRows()});
  });
}

/* ---------- day detail ---------- */
function itemRow(it){
  const tgs=tagsOf(it).map(id=>db.tags[id]);
  const card=it.card&&db.cards[it.card]?db.cards[it.card].name:'';
  const sign=it.type==='entrada'?'+':'−';
  return `<button class="li" data-sid="${it.sid}" data-date="${it.date}">${ic(it.type,'lg')}<div class="grow"><div class="t">${esc(it.desc||TYPES[it.type].one)}${it.rec?' <span class="mut">↻</span>':''}</div><div class="sub">${tgs.map(tag=>`<span class="chip" style="background:${tag.color}">${esc(tag.name)}</span>`).join('')}${card?esc(card)+' · ':''}${niceDate(it.date)}</div></div><span class="amt">${sign} ${money(it.amount)}</span></button>`;
}
function bindItems(root){root.querySelectorAll('.li[data-sid]').forEach(b=>b.onclick=()=>{const it=(compute().items[b.dataset.date]||[]).find(x=>x.sid===b.dataset.sid);if(it)openForm({edit:it})})}
function openDay(k,f){
  f=f||ui.filter;const day=dayOf(k),types=f==='todas'?TYPE_KEYS:[f],today=todayStr();
  const list=day.list.filter(it=>types.includes(it.type));
  let h=shead(niceDate(k))+`<p class="mut small" style="margin:-8px 0 12px">${fLabel(f)} · saldo do dia <b style="color:#fff">${money(day.bal)}</b></p><div class="list">`;
  h+=list.map(itemRow).join('');
  if(day.projD>0&&types.includes('diario'))h+=`<div class="li">${ic('diario','lg')}<div class="grow"><div class="t mut">previsão do diário</div><div class="sub">cota automática para dias futuros</div></div><span class="amt mut">− ${money(day.projD)}</span></div>`;
  if(!list.length&&!(day.projD>0&&types.includes('diario')))h+=`<p class="mut" style="padding:18px 4px">nada lançado neste dia.</p>`;
  h+=`</div><button class="btn primary full" id="dAdd">+ adicionar ${f==='todas'?'movimentação':TYPES[f].one}</button>`;
  if(k===today)h+=`<button class="btn full" id="dCheck">conferir saldo da conta</button>`;
  openSheet(h,s=>{
    bindItems(s);
    s.querySelector('#dAdd').onclick=()=>f==='todas'?chooseType('adicionar',t=>openForm({date:k,type:t})):openForm({date:k,type:f});
    const c=s.querySelector('#dCheck');if(c)c.onclick=checkBalance;
  });
}
async function checkBalance(){
  const t=todayStr(),cur=dayOf(t).bal;
  const v=await promptDialog('conferir saldo',`o app calcula ${money(cur)} hoje. quanto tem de verdade somando suas contas?`,numStr(cur),'decimal');
  if(v==null)return;const real=parseMoney(v);if(!isFinite(real))return toast('valor inválido');
  const diff=r2(real-cur);
  if(Math.abs(diff)<0.005){db.checks[t]={v:true,u:now()};save();closeSheet();render();return toast('saldo bate ✓ check-in feito')}
  const ok=await dialog('ajustar saldo',`diferença de ${money(diff)}. criar um lançamento de ajuste hoje?`,[{label:diff<0?'lançar como diário (gasto não anotado)':'lançar como entrada',val:true,cls:'primary'}]);
  if(!ok)return;
  const id=uid();
  db.series[id]={id,type:diff<0?'diario':'entrada',desc:'ajuste de saldo',amount:Math.abs(diff),tag:'',card:'',start:t,rep:'none',count:null,until:null,exc:{},u:now()};
  db.checks[t]={v:true,u:now()};save();closeSheet();render();toast('saldo ajustado ✓');
}

const pageStack=[];
function openPage(o,mount){
  let el=o.key&&pageStack.find(x=>x.dataset.key===o.key);
  if(!el){
    el=document.createElement('div');el.className='page';if(o.key)el.dataset.key=o.key;
    $('#pages').appendChild(el);pageStack.push(el);$('#pages').classList.add('on');
    try{history.pushState({fluxoPage:pageStack.length},'')}catch(e){}
  }
  const acts=(o.actions||[]).map((a,i)=>`<button data-pact="${i}" title="${a.title||''}">${a.icon}</button>`).join('');
  let head;
  if(o.amount!==undefined)head=`<div class="phead amt"><span class="rs">R$</span><input id="pgAmt" value="${esc(o.amount)}">${acts}${o.noClose?'':`<button data-pback title="fechar">${SVG_X}</button>`}</div>`;
  else if(o.mode==='close')head=`<div class="phead"><h1>${o.title}</h1>${acts}<button data-pback title="fechar">${SVG_X}</button></div>`;
  else head=`<div class="phead back"><button data-pback title="voltar">${SVG_BACK}</button><h1>${o.title}</h1>${acts}</div>`;
  el.innerHTML=head+`<div class="pbody">${o.body||''}</div>`+(o.foot?`<div class="pfoot">${o.foot}</div>`:'')+(o.button?`<div class="pfoot"><button class="pbtn" id="pgBtn">${o.button}</button></div>`:'');
  el.querySelectorAll('[data-pback]').forEach(b=>b.onclick=back);
  (o.actions||[]).forEach((a,i)=>el.querySelector(`[data-pact="${i}"]`).onclick=a.on);
  if(mount)mount(el);
  return el;
}
function popPage(){const el=pageStack.pop();if(!el)return;el.remove();if(!pageStack.length)$('#pages').classList.remove('on');if(el._onClose)el._onClose()}
function back(){
  const top=pageStack[pageStack.length-1];if(!top)return;
  try{history.back()}catch(e){}
  setTimeout(()=>{if(pageStack[pageStack.length-1]===top)popPage()},400);
}
window.addEventListener('popstate',()=>{
  const sheetOn=$('#sheetWrap').classList.contains('on');
  if(sheetOn&&pageStack.length&&$('#sheetWrap').style.zIndex==='35'){closeSheet();try{history.pushState({fluxoPage:pageStack.length},'')}catch(e){}return}
  if(pageStack.length)popPage();else if(sheetOn)closeSheet();
});

function datePicker(cur,cb){
  let sel=cur||todayStr();const p=parseD(sel);let vy=p.y,vm=p.m;
  openSheet(`<div class="shead"><h3 class="big">data</h3><button class="x" data-close>${SVG_X}</button></div>
    <div class="dphd"><b id="dpT"></b><button id="dpToday" title="hoje">${SVG_CAL2}</button><button id="dpP" title="mês anterior">${CHEV_L}</button><button id="dpN" title="próximo mês">${CHEV_R}</button></div>
    <div class="dpgrid" id="dpG"></div><button class="pbtn" id="dpSave">salvar</button>`,s=>{
    const G=s.querySelector('#dpG'),today=todayStr();
    const draw=()=>{
      s.querySelector('#dpT').textContent=`${MESES_L[vm-1]} de ${vy}`;
      const first=new Date(vy,vm-1,1).getDay(),n=dim(vy,vm),pv=addMonths(vy,vm,-1),pn=dim(pv.y,pv.m),nx=addMonths(vy,vm,1);
      let hh=['dom.','seg.','ter.','qua.','qui.','sex.','sáb.'].map(w=>`<div class="wd">${w}</div>`).join('');
      const cell=(y,m,d,out)=>{const k=ds(y,m,d);return `<button data-d="${k}" class="${out?'out':''} ${k===sel?'sel':''} ${k===today?'td':''}">${d}</button>`};
      for(let i=first-1;i>=0;i--)hh+=cell(pv.y,pv.m,pn-i,true);
      for(let d=1;d<=n;d++)hh+=cell(vy,vm,d,false);
      const tail=(7-((first+n)%7))%7;for(let d=1;d<=tail;d++)hh+=cell(nx.y,nx.m,d,true);
      G.innerHTML=hh;
      G.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{sel=b.dataset.d;const q=parseD(sel);if(q.m!==vm||q.y!==vy){vy=q.y;vm=q.m}draw()});
    };
    draw();
    s.querySelector('#dpP').onclick=()=>{const a=addMonths(vy,vm,-1);vy=a.y;vm=a.m;draw()};
    s.querySelector('#dpN').onclick=()=>{const a=addMonths(vy,vm,1);vy=a.y;vm=a.m;draw()};
    s.querySelector('#dpToday').onclick=()=>{sel=todayStr();const q=parseD(sel);vy=q.y;vm=q.m;draw()};
    s.querySelector('#dpSave').onclick=()=>{closeSheet();cb(sel)};
  });
}
function repeatPicker(rep,cnt,cb){

function applyEdit(scope,s,edit,v){
  const t=now();
  if(scope==='next'&&edit.idx===0)scope='all';
  if(scope==='one'){
    s.exc=s.exc||{};
    if(v.date!==edit.date||v.type!==s.type){
      s.exc[edit.date]={del:true};
      const id=uid();db.series[id]={id,type:v.type,desc:v.desc,amount:v.amount,tag:v.tag,card:v.card,start:v.date,rep:'none',count:null,until:null,exc:{},u:t};
    }else s.exc[edit.date]={amount:v.amount,desc:v.desc,tag:v.tag,card:v.card};
    s.u=t;return;
  }
  if(scope==='next'){
    const id=uid(),exc={};
    for(const [d,x] of Object.entries(s.exc||{}))if(d>edit.date)exc[d]=x;
    const count=v.rep==='none'?null:(v.cntChanged?v.count:(s.count?Math.max(1,s.count-edit.idx):null));
    db.series[id]={id,type:v.type,desc:v.desc,amount:v.amount,tag:v.tag,card:v.card,start:v.date,rep:v.rep,count,parc:v.parc,total:v.total,until:s.until||null,exc:v.date===edit.date?exc:{},u:t};
    s.until=addDays(edit.date,-1);s.u=t;return;
  }
  const shift=daysBetween(edit.date,v.date);
  Object.assign(s,{type:v.type,desc:v.desc,amount:v.amount,tag:v.tag,card:v.card,rep:v.rep,count:v.rep==='none'?null:v.count,parc:v.parc,total:v.total,u:t});
  if(shift){s.start=addDays(s.start,shift);s.exc={}}
  if(s.exc)for(const d of Object.keys(s.exc))if(!s.exc[d].del)delete s.exc[d];
}

function maskMoney(el,allowNeg,bare){

function yearSheet(metric,year){

  }else if(metric==='eco'){
    const eco=ms.reduce((a,t)=>a+t.economia,0),ent=ms.reduce((a,t)=>a+t.entrada,0);

      ms.map((t,i)=>`<button class="yblock" data-mm="${i+1}"><div class="hd"><span>${MESES_L[i]}</span><span>${pctTxt(t.pct)}</span></div>${ecoBar(t.economia,t.entrada)}</button>`).join('');
  }else{
    b+=`<div class="ylbl">média por mês</div>`+ms.map((t,i)=>{

/* ---------- sync (GitHub Gist privado) ---------- */
const FILE='fluxo-dados.json';
let sync=(()=>{try{return JSON.parse(store.get(SYNC_KEY))||{}}catch(e){return {}}})();
const saveSync=()=>store.set(SYNC_KEY,JSON.stringify(sync));
let syncState='',syncing=false,syncPending=false,syncT=null;
function setSyncState(s){syncState=s;if(tab==='menu')renderMenu();const st=document.getElementById('syState');if(st)st.textContent=s}
function scheduleSync(){if(!sync.token||!sync.gist)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),2500)}
async function gh(path,opt){
  const r=await fetch('https://api.github.com'+path,Object.assign({cache:'no-store'},opt||{},{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+sync.token,'Content-Type':'application/json'}}));
  if(!r.ok)throw new Error(r.status===401?'token inválido':r.status===404?'gist não encontrado':'GitHub '+r.status);
  return r.json();
}
async function pullRemote(){
  const g=await gh('/gists/'+sync.gist);const f=g.files&&g.files[FILE];if(!f)return null;
  let txt=f.content;if(f.truncated)txt=await (await fetch(f.raw_url,{cache:'no-store'})).text();
  return JSON.parse(txt);
}
const pushRemote=data=>gh('/gists/'+sync.gist,{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:JSON.stringify(data)}}})});
function mergeDB(a,b){
  const out=emptyDB();
  for(const k of ['series','tags','cards','prev','checks']){
    const A=a[k]||{},B=b[k]||{};
    for(const id of new Set([...Object.keys(A),...Object.keys(B)])){const x=A[id],y=B[id];out[k][id]=!x?y:!y?x:((y.u||0)>(x.u||0)?y:x)}
  }
  out.settings=((b.settings&&b.settings.u)||0)>((a.settings&&a.settings.u)||0)?b.settings:(a.settings||out.settings);
  return out;
}
function stable(o){if(Array.isArray(o))return '['+o.map(stable).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';return JSON.stringify(o)}
async function syncNow(manual){
  if(!sync.token||!sync.gist){if(manual)toast('configure a sincronização');return}
  if(!navigator.onLine){setSyncState('offline · alterações guardadas, sincroniza quando voltar a internet');return}
  if(syncing){syncPending=true;return}
  syncing=true;setSyncState('sincronizando…');
  try{
    const remote=await pullRemote();
    const merged=remote?mergeDB(db,remote):db;
    if(stable(merged)!==stable(db)){db=merged;store.set(DB_KEY,JSON.stringify(db));cache=null;render()}
    if(!remote||stable(merged)!==stable(mergeDB(remote,emptyDB())))await pushRemote(merged);
    if(!syncPending)store.set(DIRTY_KEY,'');
    sync.last=now();saveSync();
    setSyncState('sincronizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    if(manual)toast('sincronizado ✓');
  }catch(e){setSyncState('erro: '+e.message);if(manual)toast('erro: '+e.message)}
  finally{syncing=false;if(syncPending){syncPending=false;scheduleSync()}}
}
function syncSheet(){
  openPg('sincronizar celular ↔ PC',`<p class="hint">o app funciona 100% offline. para ter os mesmos dados no celular e no PC, ele guarda uma cópia num <b>Gist secreto</b> da sua conta GitHub (grátis). sempre que tiver internet, junta as alterações dos dois lados.</p>
  <p class="hint"><b>1.</b> em github.com → Settings → Developer settings → Personal access tokens → <i>Tokens (classic)</i> → gere um token marcando só <b>gist</b>.<br><b>2.</b> no primeiro aparelho: cole o token e toque em "criar gist".<br><b>3.</b> no outro aparelho: cole o mesmo token e o ID do gist, e toque em "conectar".</p>
  <label class="f">token do GitHub<input id="syTok" type="password" autocomplete="off" value="${esc(sync.token||'')}"></label>
  <label class="f">ID do gist<input id="syGist" autocomplete="off" placeholder="aparece aqui depois de criar" value="${esc(sync.gist||'')}"></label>
  <div class="status" id="syState">${esc(syncState||(sync.gist?'conectado':'não conectado'))}</div>
  <button class="btn primary full" id="syCreate">criar gist (primeiro aparelho)</button>
  <button class="btn full" id="syConn">conectar / sincronizar agora</button>
  ${sync.token?'<button class="btn danger full" id="syOff">desconectar este aparelho</button>':''}
  <p class="hint" style="margin-top:12px">o token fica só neste aparelho e nunca vai para o gist.</p>`,s=>{
    const read=()=>{sync.token=s.querySelector('#syTok').value.trim();sync.gist=s.querySelector('#syGist').value.trim().replace(/.*\//,'');saveSync()};
    s.querySelector('#syCreate').onclick=async()=>{read();if(!sync.token)return toast('cole o token');
      if(sync.gist&&!await dialog('já existe um gist','criar outro vai trocar o gist usado por este aparelho.',[{label:'criar mesmo assim',val:true}]))return;
      try{setSyncState('criando…');const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Fluxo – dados financeiros (não apagar)',public:false,files:{[FILE]:{content:JSON.stringify(db)}}})});sync.gist=g.id;sync.last=now();saveSync();store.set(DIRTY_KEY,'');s.querySelector('#syGist').value=g.id;setSyncState('gist criado ✓ use este ID no outro aparelho');toast('gist criado ✓')}catch(e){setSyncState('erro: '+e.message)}};
    s.querySelector('#syConn').onclick=()=>{read();syncNow(true)};
    const off=s.querySelector('#syOff');if(off)off.onclick=()=>{sync={};saveSync();syncState='';back();renderMenu();toast('desconectado')};
  });
}
window.addEventListener('online',()=>syncNow(false));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){cache=null;render();syncNow(false)}});

/* ---------- tabs / nav ---------- */
let tab='saldos';
function setTab(t){tab=t;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+t));document.querySelectorAll('nav.bottom [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render()}
document.querySelectorAll('nav.bottom [data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#btnPlus').onclick=()=>chooseType('adicionar',t=>openForm({date:todayStr(),type:t}));
$('#prevM').onclick=()=>{view=addMonths(view.y,view.m,-1);render()};
$('#nextM').onclick=()=>{view=addMonths(view.y,view.m,1);render()};
$('#btnToday').onclick=()=>{const p=parseD(todayStr());view={y:p.y,m:p.m};wantScrollToday=true;setTab('saldos')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dlgWrap').classList.contains('on'))return;if(pageStack.length)return back();closeSheet();$('#horizon').classList.remove('on')}});
function render(){
  if(tab==='totais'&&isSide())return setTab('saldos');
  renderHeader();
  if(tab==='saldos')renderRows();else if(tab==='totais')renderTotais();else if(tab==='tags')renderTags();else renderMenu();
  const side=$('#side');
  if(isSide()){side.innerHTML=totaisHTML()+`<p class="mut small pad">clique no valor para ver/editar o dia · botão direito para lançar · clique no número do dia para o check-in</p>`;bindTotais(side)}else side.innerHTML='';
}
window.matchMedia('(min-width:1000px)').addEventListener('change',()=>render());
window.matchMedia('(min-width:1400px)').addEventListener('change',()=>render());

/* ---------- first run ---------- */
function welcome(){
  openSheet(shead('bem-vindo ao Fluxo')+`<p class="hint" style="font-size:14px">vamos começar pelo <b>saldo de hoje</b>: some o dinheiro de todas as suas contas correntes.</p><label class="f">saldo atual (R$)<input id="wSaldo" inputmode="decimal" placeholder="0,00"></label><button class="btn primary full" id="wGo">começar</button><button class="btn full" id="wSkip">pular</button>`,s=>{
    maskMoney(s.querySelector('#wSaldo'));
    const done=()=>{store.set('fluxo-welcomed','1')};
    s.querySelector('#wGo').onclick=()=>{const v=parseMoney(s.querySelector('#wSaldo').value);if(isFinite(v)&&v!==0){const id=uid(),t=todayStr();db.series[id]={id,type:v>0?'entrada':'saida',desc:'saldo inicial',amount:Math.abs(r2(v)),tag:'',card:'',start:t,rep:'none',count:null,until:null,exc:{},u:now()};save()}done();closeSheet();render();prevSheet()};
    s.querySelector('#wSkip').onclick=()=>{done();closeSheet()};
  });
}

render();
if(!store.get('fluxo-welcomed')&&!live(db.series).length)welcome();
syncNow(false);
if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){navigator.serviceWorker.register('sw.js').then(r=>{setInterval(()=>r.update().catch(()=>{}),3600000)}).catch(()=>{});let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl)return;rl=true;location.reload()})}
setInterval(()=>{if(cache&&cache.today!==todayStr())render()},60000);
window.__fluxo={get db(){return db},compute,monthTotals};
})();
